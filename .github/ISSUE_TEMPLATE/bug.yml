name: Bug report
description: Report a reproducible LAITA problem with synthetic data.
body:
  - type: markdown
    attributes:
      value: "Do not attach keys, real history/logs/audio, student data or runtime databases. Security issues belong in the private reporting channel in SECURITY.md."
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: LAITA commit, OS/browser, Node/npm, provider and model versions
    validations:
      required: true
