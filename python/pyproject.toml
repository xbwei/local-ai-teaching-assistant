[project]
name = "laita-development-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

# Toolchain pin consumed by validate-application.sh.
[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff==0.16.5"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
